<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ipLaY — Intro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Bebas+Neue&display=swap');

  :root{
    --bg:#0a0f0a;
    --accent:#1DB954;
    --accent-20:rgba(29,185,84,0.12);
    --muted:rgba(255,255,255,0.18);
    --glass: rgba(255,255,255,0.02);
    --max-width:1100px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    background:var(--bg);
    color:#fff;
    font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;overflow:auto;
    position:relative;
  }

  /* Reduce motion preference respect */
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }

  /* Layout container */
  #scene{z-index:10;max-width:var(--max-width);width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px}

  /* Play button: semantic, accessible, responsive */
  #play-icon{
    width:clamp(48px,8vw,96px);height:clamp(48px,8vw,96px);border-radius:999px;border:none;background:linear-gradient(180deg,var(--accent),#0f7b3b);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 30px rgba(13,82,22,0.35);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;flex-shrink:0;
  }
  #play-icon:active{transform:scale(.98)}
  #play-icon:focus{outline:3px solid rgba(29,185,84,0.22);outline-offset:6px}

  #logo-wrap{display:flex;align-items:center;gap:14px;transform-origin:center;}

  /* Brand using fluid type */
  #brand-text{display:flex;flex-direction:column;line-height:1}
  #brand-ip,#brand-lay{font-family:'Bebas Neue',system-ui; font-size:clamp(28px,6vw,72px);letter-spacing:-1px}
  #brand-ip{color:#fff}
  #brand-lay{color:var(--accent)}

  #tagline{font-size:12px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}

  /* Visualizer */
  #viz{display:flex;align-items:flex-end;gap:6px;height:56px}
  .bar{width:6px;background:var(--accent);border-radius:4px 4px 0 0;transform-origin:bottom;animation:barDance var(--dur) ease-in-out infinite alternate}
  @keyframes barDance { from { height: var(--min); } to { height: var(--max); } }

  /* Rings: subtle and responsive */
  .ring{position:fixed;border-radius:50%;border:1px solid var(--accent-20);pointer-events:none;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);mix-blend-mode:screen}
  .ring.r1{width:min(420px,65vw);height:min(420px,65vw);opacity:.14}
  .ring.r2{width:min(680px,95vw);height:min(680px,95vw);opacity:.09}
  .ring.r3{width:min(960px,140vw);height:min(960px,140vw);opacity:.06}

  /* Corner glows */
  .corner-glow{position:fixed;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--accent-20) 0%,transparent 68%);pointer-events:none}
  .corner-glow.tl{top:-120px;left:-120px}
  .corner-glow.br{bottom:-120px;right:-120px}

  /* Tamil + controls */
  #tamil-text{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);letter-spacing:3px}
  #version{position:fixed;left:18px;bottom:18px;font-size:11px;color:var(--muted)}

  /* Skip control */
  #skip{position:fixed;right:18px;bottom:18px;background:transparent;border:1px solid transparent;color:var(--muted);padding:10px 16px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s}
  #skip:active{transform:scale(.98)}
  #skip:hover{color:var(--accent);background:rgba(29,185,84,0.03)}

  /* Progress bar */
  #progress-track{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,0.04)}
  #progress-fill{height:100%;width:0;background:linear-gradient(90deg,#0f5c28,var(--accent));transition:width 6s linear}

  /* Canvas layers */
  canvas#bg,canvas#particles{position:fixed;inset:0;z-index:0;pointer-events:none}

  /* Cursor (hidden on coarse pointers) */
  #cursor{position:fixed;width:12px;height:12px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 18px rgba(29,185,84,0.6);mix-blend-mode:screen}
  @media (pointer:coarse){#cursor{display:none}} 

  /* Responsiveness tweaks */
  @media (max-width:520px){
    #scene{padding:20px}
    .corner-glow{display:none}
    .ring{display:none}
    #tagline{display:none}
    #viz{height:42px}
    #tamil-text{font-size:11px;top:12px}
  }

</style>
</head>
<body>

<div id="cursor"></div>

<!-- BG canvas -->
<canvas id="bg"></canvas>
<canvas id="particles"></canvas>

<!-- Glows -->
<div class="corner-glow tl"></div>
<div class="corner-glow br"></div>

<!-- Rings -->
<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>

<!-- Tamil header text -->
<div id="tamil-text">தமிழ் இசை • TAMIL MUSIC</div>

<!-- Main scene -->
<div id="scene">
  <div id="logo-wrap">
    <button id="play-icon" aria-label="Start intro">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="white" aria-hidden="true">
        <polygon points="5,3 19,12 5,21" />
      </svg>
    </button>
    <div id="brand-text">
      <span id="brand-ip">ip</span>
      <span id="brand-lay">LaY</span>
    </div>
  </div>

  <div id="tagline">Your Stage. Their Soul.</div>

  <!-- Visualizer bars -->
  <div id="viz"></div>

  <!-- Pills -->
  <!-- <div id="pills">
    <div class="pill">Tamil Music</div>
    <div class="pill">Curated Playlists</div>
    <div class="pill">All Moods</div>
  </div>
</div> -->

<!-- Footer -->
<div id="version">v1.0</div>
<button id="skip" aria-label="Skip intro">Skip →</button>

<!-- Progress -->
<div id="progress-track"><div id="progress-fill"></div></div>

<!-- Outro -->
<div id="outro"></div>

<script>
/* ─── One-time intro check ─── */
if (sessionStorage.getItem('introSeen')) {
  window.location.href = 'index1.html';
}

/* ─── Cursor ─── */
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

/* ─── BG Canvas — waveform ─── */
const bgC = document.getElementById('bg');
const bgX = bgC.getContext('2d');
bgC.width  = window.innerWidth;
bgC.height = window.innerHeight;

let t = 0;
function drawBG() {
  bgX.clearRect(0, 0, bgC.width, bgC.height);
  bgX.fillStyle = '#0a0f0a';
  bgX.fillRect(0, 0, bgC.width, bgC.height);

  const cx = bgC.width / 2;
  const cy = bgC.height / 2;

  for (let i = 0; i < 3; i++) {
    bgX.beginPath();
    bgX.moveTo(0, cy);
    const amp   = 28 + i * 12;
    const freq  = 0.004 + i * 0.002;
    const speed = 0.012 + i * 0.006;
    for (let x = 0; x <= bgC.width; x += 2) {
      const y = cy + amp * Math.sin(x * freq + t * speed + i * 1.2)
                   + (amp * 0.5) * Math.sin(x * freq * 2 - t * speed * 1.5);
      bgX.lineTo(x, y);
    }
    bgX.strokeStyle = `rgba(29,185,84,${0.04 + i * 0.02})`;
    bgX.lineWidth = 1.5;
    bgX.stroke();
  }

  t++;
  requestAnimationFrame(drawBG);
}
drawBG();

/* ─── Particle canvas ─── */
const pC = document.getElementById('particles');
const pX = pC.getContext('2d');
pC.width  = window.innerWidth;
pC.height = window.innerHeight;

let particles = [];

function createParticlesAdaptive() {
  const area = window.innerWidth * window.innerHeight;
  const count = Math.max(18, Math.min(120, Math.floor(area / 200000)));
  particles.length = 0;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * pC.width,
      y: Math.random() * pC.height,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - 0.5) * 0.35,
      vy: -Math.random() * 0.5 - 0.15,
      a: Math.random() * 0.5 + 0.1,
    });
  }
}

createParticlesAdaptive();

function drawParticles() {
  pX.clearRect(0, 0, pC.width, pC.height);
  for (const p of particles) {
    pX.beginPath();
    pX.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pX.fillStyle = `rgba(29,185,84,${p.a})`;
    pX.fill();
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -5) { p.y = pC.height + 5; p.x = Math.random() * pC.width; }
    if (p.x < 0 || p.x > pC.width) p.vx *= -1;
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// Hide custom cursor on coarse pointers and add touch ripple feedback
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
  cur.style.display = 'none';
}
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  if (!t) return;
  const ripple = document.createElement('div');
  ripple.style.cssText = `position:fixed;left:${t.clientX}px;top:${t.clientY}px;width:18px;height:18px;background:#1DB95455;border-radius:50%;transform:translate(-50%,-50%) scale(1);pointer-events:none;z-index:99999;transition:transform .45s ease,opacity .45s ease;`;
  document.body.appendChild(ripple);
  requestAnimationFrame(() => { ripple.style.transform = 'translate(-50%,-50%) scale(6)'; ripple.style.opacity = '0'; });
  setTimeout(() => ripple.remove(), 600);
});

/* ─── Visualizer bars ─── */
const viz = document.getElementById('viz');
const heights = [10,16,24,34,44,52,48,38,28,52,44,34,24,36,48,54,46,36,26,18,28,40,50,42,32,22,32,44,52,44,34,24];
heights.forEach((h, i) => {
  const bar = document.createElement('div');
  bar.className = 'bar';
  const min = Math.max(4, h * 0.25) + 'px';
  const max = h + 'px';
  const dur = (0.35 + Math.random() * 0.5).toFixed(2) + 's';
  bar.style.cssText = `--min:${min}; --max:${max}; --dur:${dur}; animation-delay:${(i * 0.04).toFixed(2)}s; height:${min};`;
  viz.appendChild(bar);
});

/* ─── Skip ─── */
document.getElementById('skip').onclick = () => {
  sessionStorage.setItem('introSeen', 'true');
  document.getElementById('outro').style.animation = 'outroFade 0.4s ease forwards';
  setTimeout(() => window.location.href = 'index1.html', 200);
};

/* ─── Intro control / play interaction ─── */
let introStarted = false;
const playBtn = document.getElementById('play-icon');
const progressFill = document.getElementById('progress-fill');

function startIntro(fromUser = false){
  if (introStarted) return;
  introStarted = true;
  // animate progress fill (fallback for reduced-motion)
  requestAnimationFrame(() => {
    progressFill.style.width = '100%';
  });
  // subtle click feedback
  playBtn.animate([{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});
  // mark seen and navigate after short delay so user perceives action
  sessionStorage.setItem('introSeen','true');
  setTimeout(() => { window.location.href = 'index1.html'; }, 900);
}

// Click / keyboard handlers
playBtn.addEventListener('click', (e) => {
  startIntro(true);
});
playBtn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startIntro(true); }
});

// Start automatically if user does nothing (gentle auto-advance)
const autoAdvance = setTimeout(() => { if (!introStarted) startIntro(false); }, 6000);

/* ─── Resize (debounced) ─── */
let __resizeTimer;
function handleResize() {
  bgC.width = pC.width = window.innerWidth;
  bgC.height = pC.height = window.innerHeight;
  // regenerate particles to match new size
  if (typeof createParticlesAdaptive === 'function') createParticlesAdaptive();
}
window.addEventListener('resize', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(handleResize, 120);
});
</script>
</body>
</html>
