<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ipLaY — Intro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Bebas+Neue&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0f0a;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
  }

  /* ─── Cursor ─── */
  #cursor {
    position: fixed;
    width: 10px;
    height: 10px;
    background: #1DB954;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s;
    box-shadow: 0 0 18px #1DB954aa;
  }

  /* ─── Canvas ─── */
  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ─── Scene wrapper ─── */
  #scene {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ─── Rings ─── */
  .ring {
    position: fixed;
    border-radius: 50%;
    border: 1px solid #1DB95411;
    animation: ringPulse 4s ease-in-out infinite;
  }
  .ring:nth-child(1) { width: 300px; height: 300px; animation-delay: 0s; }
  .ring:nth-child(2) { width: 500px; height: 500px; animation-delay: 0.5s; }
  .ring:nth-child(3) { width: 700px; height: 700px; animation-delay: 1s; }
  .ring:nth-child(4) { width: 900px; height: 900px; animation-delay: 1.5s; }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.03); opacity: 0.7; }
  }

  /* ─── Logo block ─── */
  #logo-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: scale(0.7) translateY(30px);
    animation: logoIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  @keyframes logoIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ─── Play icon SVG ─── */
  #play-icon {
    width: 72px;
    height: 72px;
    background: #1DB954;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 0 #1DB95440;
    animation: iconPulse 2.2s ease-in-out 1.5s infinite;
    flex-shrink: 0;
  }

  @keyframes iconPulse {
    0%   { box-shadow: 0 0 0 0 #1DB95440; }
    60%  { box-shadow: 0 0 0 22px #1DB95400; }
    100% { box-shadow: 0 0 0 0 #1DB95400; }
  }

  #play-icon svg { margin-left: 5px; }

  /* ─── Brand text ─── */
  #brand-text { display: flex; flex-direction: column; line-height: 1; }

  #brand-ip {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    letter-spacing: -2px;
    color: #fff;
    line-height: 0.9;
  }

  #brand-lay {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    letter-spacing: -2px;
    color: #1DB954;
    line-height: 0.9;
  }

  /* ─── Tagline ─── */
  #tagline {
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #1DB954aa;
    opacity: 0;
    animation: fadeUp 0.9s ease 1.3s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ─── Visualizer ─── */
  #viz {
    margin-top: 42px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 56px;
    opacity: 0;
    animation: fadeUp 0.7s ease 1.6s forwards;
  }

  .bar {
    width: 5px;
    background: #1DB954;
    border-radius: 3px 3px 0 0;
    animation: barDance var(--dur) ease-in-out infinite alternate;
    transform-origin: bottom;
    opacity: 0.9;
  }

  @keyframes barDance {
    from { height: var(--min); }
    to   { height: var(--max); }
  }

  /* ─── Subtitle pills ─── */
  #pills {
    margin-top: 36px;
    display: flex;
    gap: 10px;
    opacity: 0;
    animation: fadeUp 0.7s ease 2s forwards;
  }

  .pill {
    padding: 6px 16px;
    border-radius: 100px;
    border: 1px solid #1DB95440;
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #1DB954cc;
    text-transform: uppercase;
    background: #1DB95408;
  }

  /* ─── Skip button ─── */
  #skip {
    position: fixed;
    bottom: 36px;
    right: 40px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffffff44;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    background: transparent;
    transition: color 0.3s;
    opacity: 0;
    animation: fadeUp 0.7s ease 2.2s forwards;
    z-index: 100;
  }
  #skip:hover { color: #1DB954; }

  /* ─── Progress bar ─── */
  #progress-track {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: #ffffff0a;
    z-index: 100;
    opacity: 0;
    animation: fadeUp 0.5s ease 2.2s forwards;
  }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0f5c28, #1DB954);
    animation: progressAnim 6s linear 2.2s forwards;
  }
  @keyframes progressAnim {
    to { width: 100%; }
  }

  /* ─── Outro fade ─── */
  #outro {
    position: fixed;
    inset: 0;
    background: #0a0f0a;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    animation: outroFade 0.8s ease 8.2s forwards;
  }
  @keyframes outroFade {
    to { opacity: 1; }
  }

  /* ─── Particle canvas ─── */
  canvas#particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ─── Corner glows ─── */
  .corner-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, #1DB95414 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }
  .corner-glow.tl { top: -150px; left: -150px; }
  .corner-glow.br { bottom: -150px; right: -150px; }

  /* ─── Tamil text ─── */
  #tamil-text {
    position: fixed;
    top: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #ffffff22;
    letter-spacing: 3px;
    opacity: 0;
    animation: fadeUp 0.7s ease 1.8s forwards;
    white-space: nowrap;
    z-index: 10;
  }

  /* ─── Version ─── */
  #version {
    position: fixed;
    bottom: 36px;
    left: 40px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #ffffff22;
    opacity: 0;
    animation: fadeUp 0.5s ease 2.2s forwards;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="cursor"></div>

<!-- BG canvas -->
<canvas id="bg"></canvas>
<canvas id="particles"></canvas>

<!-- Glows -->
<div class="corner-glow tl"></div>
<div class="corner-glow br"></div>

<!-- Rings -->
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>

<!-- Tamil header text -->
<div id="tamil-text">தமிழ் இசை • TAMIL MUSIC</div>

<!-- Main scene -->
<div id="scene">
  <div id="logo-wrap">
    <div id="play-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
        <polygon points="5,3 19,12 5,21" />
      </svg>
    </div>
    <div id="brand-text">
      <span id="brand-ip">ip</span>
      <span id="brand-lay">LaY</span>
    </div>
  </div>

  <div id="tagline">Your Stage. Their Soul.</div>

  <!-- Visualizer bars -->
  <div id="viz"></div>

  <!-- Pills -->
  <!-- <div id="pills">
    <div class="pill">Tamil Music</div>
    <div class="pill">Curated Playlists</div>
    <div class="pill">All Moods</div>
  </div>
</div> -->

<!-- Footer -->
<div id="version">v1.0</div>
<button id="skip">Skip →</button>

<!-- Progress -->
<div id="progress-track"><div id="progress-fill"></div></div>

<!-- Outro -->
<div id="outro"></div>

<script>
/* ─── Cursor ─── */
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

/* ─── BG Canvas — waveform ─── */
const bgC = document.getElementById('bg');
const bgX = bgC.getContext('2d');
bgC.width  = window.innerWidth;
bgC.height = window.innerHeight;

let t = 0;
function drawBG() {
  bgX.clearRect(0, 0, bgC.width, bgC.height);
  bgX.fillStyle = '#0a0f0a';
  bgX.fillRect(0, 0, bgC.width, bgC.height);

  const cx = bgC.width / 2;
  const cy = bgC.height / 2;

  for (let i = 0; i < 3; i++) {
    bgX.beginPath();
    bgX.moveTo(0, cy);
    const amp   = 28 + i * 12;
    const freq  = 0.004 + i * 0.002;
    const speed = 0.012 + i * 0.006;
    for (let x = 0; x <= bgC.width; x += 2) {
      const y = cy + amp * Math.sin(x * freq + t * speed + i * 1.2)
                   + (amp * 0.5) * Math.sin(x * freq * 2 - t * speed * 1.5);
      bgX.lineTo(x, y);
    }
    bgX.strokeStyle = `rgba(29,185,84,${0.04 + i * 0.02})`;
    bgX.lineWidth = 1.5;
    bgX.stroke();
  }

  t++;
  requestAnimationFrame(drawBG);
}
drawBG();

/* ─── Particle canvas ─── */
const pC = document.getElementById('particles');
const pX = pC.getContext('2d');
pC.width  = window.innerWidth;
pC.height = window.innerHeight;

const particles = Array.from({ length: 55 }, () => ({
  x: Math.random() * pC.width,
  y: Math.random() * pC.height,
  r: Math.random() * 2 + 0.5,
  vx: (Math.random() - 0.5) * 0.35,
  vy: -Math.random() * 0.5 - 0.15,
  a: Math.random() * 0.5 + 0.1,
}));

function drawParticles() {
  pX.clearRect(0, 0, pC.width, pC.height);
  for (const p of particles) {
    pX.beginPath();
    pX.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pX.fillStyle = `rgba(29,185,84,${p.a})`;
    pX.fill();
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -5) { p.y = pC.height + 5; p.x = Math.random() * pC.width; }
    if (p.x < 0 || p.x > pC.width) p.vx *= -1;
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ─── Visualizer bars ─── */
const viz = document.getElementById('viz');
const heights = [10,16,24,34,44,52,48,38,28,52,44,34,24,36,48,54,46,36,26,18,28,40,50,42,32,22,32,44,52,44,34,24];
heights.forEach((h, i) => {
  const bar = document.createElement('div');
  bar.className = 'bar';
  const min = Math.max(4, h * 0.25) + 'px';
  const max = h + 'px';
  const dur = (0.35 + Math.random() * 0.5).toFixed(2) + 's';
  bar.style.cssText = `--min:${min}; --max:${max}; --dur:${dur}; animation-delay:${(i * 0.04).toFixed(2)}s; height:${min};`;
  viz.appendChild(bar);
});

/* ─── Skip ─── */
document.getElementById('skip').onclick = () => {
  document.getElementById('outro').style.animation = 'outroFade 0.4s ease forwards';
  setTimeout(() => document.body.innerHTML = '', 500);
};

/* ─── Resize ─── */
window.addEventListener('resize', () => {
  bgC.width = pC.width = window.innerWidth;
  bgC.height = pC.height = window.innerHeight;
});

// Auto-redirect after intro (8.5s)
setTimeout(() => {
  window.location.href = 'index1.html'; // your main page
}, 8500);

// Skip button
document.getElementById('skip').onclick = () => {
  window.location.href = 'index1.html';
};
</script>
</body>
</html>
